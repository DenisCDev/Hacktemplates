<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#09090b; --fg:#fafafa; --muted:#a1a1aa; --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { color-scheme:dark; }
  body { background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }

  header { max-width:1400px; margin:0 auto; padding:72px 28px 40px; }
  header h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:clamp(44px,7vw,88px); line-height:.95; letter-spacing:-.02em; }
  header h1 em { color:var(--muted); }
  header p code { font-size:.9em; color:var(--fg); }
  header p { margin-top:18px; color:var(--muted); max-width:560px; line-height:1.6; }

  .mode { display:inline-flex; margin-top:28px; padding:4px; border:1px solid var(--line); border-radius:999px; }
  .mode button { font:inherit; font-size:13px; color:var(--muted); background:none; border:0; border-radius:999px; padding:8px 16px; cursor:pointer; transition:.2s; }
  .mode button[aria-pressed="true"] { background:var(--fg); color:#000; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-top:28px; }
  .filters button { font:inherit; font-size:13px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer; transition:.2s; }
  .filters button:hover { color:var(--fg); border-color:rgba(255,255,255,.2); }
  .filters button[aria-pressed="true"] { color:#000; background:var(--fg); border-color:var(--fg); }

  main { max-width:1400px; margin:0 auto; padding:0 28px 120px; display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:28px; }
  .card { display:block; }
  .card[data-slug="pixel-sword"] .frame { image-rendering:pixelated; }
  .frame { position:relative; aspect-ratio:16/10; border-radius:14px; overflow:hidden; border:1px solid var(--line); background-size:cover; background-position:center; transition:transform .5s cubic-bezier(.2,.7,.2,1), border-color .3s; }
  .card:hover .frame { transform:translateY(-4px); border-color:rgba(255,255,255,.2); }
  .frame iframe { position:absolute; top:0; left:0; width:1440px; height:900px; border:0; transform-origin:0 0; pointer-events:none; opacity:0; transition:opacity .6s; }
  .frame iframe.ready { opacity:1; }
  .frame .num { position:absolute; top:12px; left:14px; font-size:12px; color:rgba(255,255,255,.7); mix-blend-mode:difference; }
  .meta { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:14px 2px 0; }
  .meta h2 { font-size:15px; font-weight:500; }
  .meta span { font-size:12px; color:var(--muted); }
  .alt { font-size:12px; color:var(--muted); margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .alt a:hover { color:var(--fg); }
  .alt button { font:inherit; font-size:12px; color:var(--fg); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; transition:.2s; }
  .alt button:hover { background:rgba(255,255,255,.12); }
  .alt button.ok { background:#d9f99d; color:#000; border-color:#d9f99d; }
  .alt .sp { flex:1; }
  .empty { color:var(--muted); grid-column:1/-1; }
  @media (max-width:480px){ main{ grid-template-columns:1fr; } }
</style>
<!-- Vercel Web Analytics (static-site version of @vercel/analytics) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <h1>Hero sections, <em>ready to ship.</em></h1>
  <p>Self-contained, zero-build landing heroes. Shaders, motion, and type. Hit <b>Copy hero</b>, paste into an <code>index.html</code>, done — it runs anywhere, no install. Or <b>Copy background</b> for just the motion, two lines.</p>
  <div class="mode" id="mode"><button aria-pressed="true" data-mode="">Full hero</button><button aria-pressed="false" data-mode="bg.html">Background only</button></div>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"></main>

<script src="templates/manifest.js"></script>
<script>
  const list = window.TEMPLATES || [];
  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  let active = 'all';
  let page = '';   // '' = full hero (index.html), 'bg.html' = background only

  document.getElementById('mode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    page = b.dataset.mode;
    document.querySelectorAll('#mode button').forEach(x => x.setAttribute('aria-pressed', x === b));
    unmount(); render();
  });

  const counts = {}; list.forEach(t => t.tags.forEach(g => counts[g] = (counts[g] || 0) + 1));
  const tags = ['all', ...Object.keys(counts).filter(g => counts[g] >= 3 && g !== 'image' && g !== 'webgl').sort((a, b) => counts[b] - counts[a])];
  filters.innerHTML = tags.map(t => `<button aria-pressed="${t === active}" data-tag="${t}">${t}</button>`).join('');
  filters.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    active = b.dataset.tag;
    filters.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });

  let render = function () {
    const items = list.filter(t => active === 'all' || t.tags.includes(active));
    if (!items.length) { grid.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
    grid.innerHTML = items.map(t => `
      <div class="card" data-slug="${t.slug}">
        <a href="templates/${t.slug}/${page}"><div class="frame" style="background:${t.poster}"><span class="num">${String(list.indexOf(t) + 1).padStart(2, '0')}</span></div></a>
        <div class="meta"><h2>${t.name}</h2><span>${t.tags.join(' · ')}</span></div>
        <div class="alt"><button data-copy="hero">Copy hero</button><button data-copy="bg">Copy background</button><span class="sp"></span><a href="templates/${t.slug}/" target="_blank">Open ↗</a></div>
      </div>`).join('');
  };
  render();

  // Live previews: every card on screen plays (browsers cap WebGL contexts, so at most MAX run at once;
  // off-screen ones are torn down and the poster shows until they scroll back in).
  const MAX = 10, VW = 1280, VH = 800;
  const live = new Map();          // card -> iframe
  const order = [];                // mount order, oldest first
  const visible = new Set();
  function fit(frame, iframe) { iframe.style.transform = `scale(${frame.clientWidth / VW})`; }
  function mount(card) {
    if (live.has(card)) return;
    while (live.size >= MAX) {
      const victim = order.find(c => !visible.has(c)) || order[0];
      unmountOne(victim);
    }
    const frame = card.querySelector('.frame');
    const iframe = document.createElement('iframe');
    iframe.src = `templates/${card.dataset.slug}/${page}?preview`;
    iframe.tabIndex = -1; iframe.setAttribute('aria-hidden', 'true');
    iframe.style.width = VW + 'px'; iframe.style.height = VH + 'px';
    iframe.onload = () => setTimeout(() => iframe.classList.add('ready'), 300);
    frame.appendChild(iframe); fit(frame, iframe);
    live.set(card, iframe); order.push(card);
  }
  function unmountOne(card) {
    const f = live.get(card); if (f) f.remove();
    live.delete(card); const i = order.indexOf(card); if (i >= 0) order.splice(i, 1);
  }
  function unmount() { [...live.keys()].forEach(unmountOne); visible.clear(); }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { visible.add(e.target); mount(e.target); }
    else { visible.delete(e.target); unmountOne(e.target); }
  }), { threshold: 0, rootMargin: '200px 0px' });
  const observe = () => { io.disconnect(); grid.querySelectorAll('.card').forEach(c => io.observe(c)); };
  const _render = render; render = () => { unmount(); _render(); observe(); };
  observe();
  grid.addEventListener('pointerover', e => { const c = e.target.closest('.card'); if (c) { visible.add(c); mount(c); } });
  addEventListener('resize', () => live.forEach((f, c) => fit(c.querySelector('.frame'), f)));

  // Copy: one paste-and-go file. Assets load from the hosted copy, so nothing else is needed.
  const HOST = location.hostname.endsWith('vercel.app') ? location.origin : 'https://dvklab.vercel.app';
  grid.addEventListener('click', async e => {
    const b = e.target.closest('button[data-copy]'); if (!b) return;
    const slug = b.closest('.card').dataset.slug, src = `${HOST}/templates/${slug}/bg.js`;
    let text;
    if (b.dataset.copy === 'hero') {
      text = await (await fetch(`templates/${slug}/index.html`)).text();
      text = text.replace('<script src="bg.js"><\/script>', `<script src="${src}"><\/script>`);
    } else {
      text = `<!-- motion background: put content inside the section -->
<section style="position:relative;min-height:100vh;isolation:isolate">
  <canvas data-bg style="position:absolute;inset:0;width:100%;height:100%;z-index:-1"></canvas>
</section>
<script src="${src}"><\/script>
`;
    }
    await navigator.clipboard.writeText(text);
    const was = b.textContent; b.textContent = 'Copied ✓'; b.classList.add('ok');
    setTimeout(() => { b.textContent = was; b.classList.remove('ok'); }, 1400);
  });
</script>
</body>
</html>
